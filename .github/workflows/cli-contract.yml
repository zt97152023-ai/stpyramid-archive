name: CLI contract

on:
  push:
    branches:
      - product/java-spatial-archive
      - docs/clean-project-entry
  pull_request:
    branches:
      - product/java-spatial-archive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-contract:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency-free CLI contract tests
        run: python tests/test_cli_contract.py -v
